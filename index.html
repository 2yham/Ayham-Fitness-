<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A FITNESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .neon-btn {
            background-color: #ccff00;
            color: #000000;
            box-shadow: 0 0 25px rgba(204, 255, 0, 0.45);
        }
        .neon-btn:hover {
            background-color: #d9ff33;
            box-shadow: 0 0 35px rgba(204, 255, 0, 0.75);
        }
        .neon-text {
            color: #ccff00;
            text-shadow: 0 0 15px rgba(204, 255, 0, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-black text-white selection:bg-[#ccff00] selection:text-black">

    <!-- الشريط العلوي: أيقونة الثلاث شحطات بلمسة فسفورية -->
    <header class="w-full px-6 pt-5 pb-2 flex items-center justify-between">
        <button onclick="toggleMenu()" aria-label="القائمة" class="p-2.5 rounded-xl border border-zinc-800 bg-zinc-950 hover:border-[#ccff00] transition group cursor-pointer">
            <div class="w-6 flex flex-col gap-1.5">
                <span class="block h-0.5 w-full bg-[#ccff00] rounded-full transition-all group-hover:w-4"></span>
                <span class="block h-0.5 w-full bg-white group-hover:bg-[#ccff00] rounded-full transition-all"></span>
                <span class="block h-0.5 w-4 bg-[#ccff00] rounded-full transition-all group-hover:w-full"></span>
            </div>
        </button>

        <span class="text-xs font-black tracking-widest text-zinc-500 uppercase">
            A <span class="text-[#ccff00]">FITNESS</span>
        </span>
    </header>

    <!-- القائمة الجانبية (تحتوي على خيار "عني" بلمسات فسفورية) -->
    <div id="side-menu" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 hidden flex-col justify-between p-6 fade-in">
        <div class="flex items-center justify-between">
            <span class="text-xl font-black uppercase">A <span class="neon-text">FITNESS</span></span>
            <button onclick="toggleMenu()" class="w-10 h-10 rounded-full border border-[#ccff00]/50 text-[#ccff00] hover:bg-[#ccff00] hover:text-black flex items-center justify-center text-lg font-bold transition cursor-pointer">
                ✕
            </button>
        </div>

        <nav class="flex flex-col gap-4 my-auto text-center max-w-sm mx-auto w-full">
            <button onclick="navigateTo('home-section')" class="py-4 px-6 rounded-2xl bg-zinc-900/90 border border-zinc-800 hover:border-[#ccff00] text-white hover:text-[#ccff00] text-lg font-extrabold transition cursor-pointer">
                الرئيسية
            </button>
            <button onclick="navigateTo('about-section')" class="py-4 px-6 rounded-2xl bg-[#ccff00]/10 border border-[#ccff00] text-[#ccff00] hover:bg-[#ccff00] hover:text-black text-lg font-black shadow-[0_0_20px_rgba(204,255,0,0.2)] transition cursor-pointer">
                عني
            </button>
        </nav>

        <div class="text-center text-xs text-zinc-500 font-semibold">
            A FITNESS &bull; القائمة
        </div>
    </div>

    <!-- القسم الأول: الصفحة الرئيسية (نفس الشكل السابق مع إمكانية الطلوع والنزول) -->
    <main id="home-section" class="flex-grow flex flex-col items-center justify-center px-6 py-12 text-center min-h-[75vh]">
        
        <!-- الشعار الخاص بك في المنتصف -->
        <div class="mb-8 flex items-center justify-center">
            <img id="brand-logo" 
                 src="logo.png" 
                 alt="A FITNESS" 
                 onerror="handleImageError(this)"
                 class="w-44 h-44 mx-auto object-contain rounded-2xl">
            
            <!-- شعار بديل يظهر فقط إذا لم يجد ملف الصورة في المستودع -->
            <div id="fallback-logo" class="hidden w-36 h-36 rounded-3xl border-2 border-[#ccff00] bg-[#ccff00]/10 flex items-center justify-center shadow-[0_0_30px_rgba(204,255,0,0.2)]">
                <span class="text-7xl font-black neon-text">A</span>
            </div>
        </div>

        <!-- العنوان الرئيسي -->
        <h1 class="text-4xl md:text-5xl font-black tracking-wider mb-3 uppercase">
            A <span class="neon-text">FITNESS</span>
        </h1>
        
        <p class="text-zinc-400 text-base md:text-lg max-w-sm mb-10 font-semibold">
            ابـدأ الـتـغـيـيـر الـحـقـيـقـي الآن
        </p>

        <!-- زر ابدأ الآن -->
        <button onclick="navigateTo('next-section')" class="w-full max-w-xs neon-btn active:scale-95 font-black text-xl py-4 px-8 rounded-full transition-all duration-200 cursor-pointer">
            ابدأ الآن
        </button>

    </main>
