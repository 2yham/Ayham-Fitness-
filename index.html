<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A FITNESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-black text-white selection:bg-red-600">

    <!-- القسم الأول: شاشة كاملة نظيفة بدون مربعات -->
    <main id="home-section" class="flex-grow flex flex-col items-center justify-center px-6 text-center min-h-screen">
        
        <!-- الشعار الخاص بك في المنتصف مباشرة -->
        <div class="mb-8">
            <img src="logo.png" alt="A FITNESS" class="w-44 h-44 mx-auto object-contain rounded-2xl">
        </div>

        <!-- العنوان الرئيسي -->
        <h1 class="text-4xl md:text-5xl font-black tracking-wider mb-3 uppercase">
            A <span class="text-red-600">FITNESS</span>
        </h1>
        
        <p class="text-zinc-400 text-base md:text-lg max-w-sm mb-10 font-semibold">
            ابـدأ الـتـغـيـيـر الـحـقـيـقـي الآن
        </p>

        <!-- زر ابدأ الآن -->
        <button onclick="goToNextStep()" class="w-full max-w-xs bg-red-600 hover:bg-red-700 active:scale-95 text-white font-black text-xl py-4 px-8 rounded-full shadow-[0_0_25px_rgba(220,38,38,0.5)] transition-all duration-200 cursor-pointer">
            ابدأ الآن
        </button>

    </main>

    <!-- القسم الثاني: الخانة التالية (تظهر عند الضغط) -->
    <section id="next-section" class="hidden flex-grow flex flex-col items-center justify-center px-6 text-center min-h-screen fade-in">
        <div class="w-full max-w-md">
            <h2 class="text-3xl font-black mb-4 text-white">الخطوة الثانية</h2>
            <p class="text-zinc-400 text-base mb-8">
                أهلاً بك! إحكيلي شو بدك نحط جوا هاي الخانة هسا عشان أبرمجلك إياها فوراً.
            </p>
            <button onclick="goBack()" class="text-zinc-400 hover:text-white border border-zinc-800 hover:border-zinc-600 px-6 py-2.5 rounded-full text-sm font-bold transition">
                → رجوع
            </button>
        </div>
    </section>

    <script>
        function goToNextStep() {
            document.getElementById('home-section').classList.add('hidden');
            document.getElementById('next-section').classList.remove('hidden');
        }

        function goBack() {
            document.getElementById('next-section').classList.add('hidden');
            document.getElementById('home-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
