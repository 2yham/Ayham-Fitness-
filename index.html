<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Fitness</title>
    <!-- استخدام تايليند لتصميم عصري وسريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0f19; /* خلفية داكنة فخمة مشابهة للموقع المستهدف */
            color: #ffffff;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- القسم الأول: الصفحة الرئيسية (بمطابقة تامة لستايل الموقع المطلوب وبدون نتائج) -->
    <section id="home-section" class="flex-grow flex flex-col items-center justify-center px-4 py-12 text-center transition-all duration-500">
        <div class="max-w-md w-full bg-[#131b2e] border border-slate-800 p-8 rounded-3xl shadow-2xl">
            
            <!-- الشعار -->
            <div class="mb-6 flex justify-center">
                <div class="w-28 h-28 bg-white/5 rounded-2xl p-2 border border-slate-700/50 flex items-center justify-center">
                    <!-- ضع رابط شعارك هنا أو اترك الصورة المؤقتة -->
                    <img src="https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=300&auto=format&fit=crop" alt="A Fitness Logo" class="max-h-full max-w-full object-contain">
                </div>
            </div>

            <h1 class="text-3xl font-black mb-2 text-white tracking-wide">A FITNESS</h1>
            <p class="text-slate-400 text-sm mb-8 leading-relaxed">
                خطوتك الأولى نحو جسم متناسق وقوة حقيقية تبدأ من هنا. اختر البداية وانطلق معنا.
            </p>

            <!-- زر "ابدأ الان" بستايل فخم ومميز -->
            <button onclick="goToNextStep()" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-red-600/20 transition duration-300 transform hover:scale-[1.02] text-lg">
                ابدأ الآن
            </button>
        </div>
    </section>

    <!-- القسم الثاني: الخانة التالية (تظهر عند الضغط بسلاسة) -->
    <section id="next-section" class="hidden flex-grow flex flex-col items-center justify-center px-4 py-12 text-center fade-in">
        <div class="max-w-md w-full bg-[#131b2e] border border-slate-800 p-8 rounded-3xl shadow-2xl">
            <h2 class="text-2xl font-bold mb-4 text-white">الخطوة الثانية</h2>
            <p class="text-slate-300 text-sm mb-6">
                أهلاً بك! نحن جاهزون لإضافة تفاصيلك أو الأسئلة الخاصة بك هنا. أخبرني ماذا تريد أن نضع في هذه الخانة لنقوم برمجتها فوراً.
            </p>
            <button onclick="goBack()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold py-2.5 px-6 rounded-xl transition border border-slate-700">
                العودة للخلف
            </button>
        </div>
    </section>

    <!-- تذييل الموقع -->
    <footer class="py-6 text-center text-xs text-slate-600">
        جميع الحقوق محفوظة &copy; 2026 A Fitness
    </footer>

    <!-- سكربت التنقل الداخلي -->
    <script>
        function goToNextStep() {
            document.getElementById('home-section').classList.add('hidden');
            document.getElementById('next-section').classList.remove('hidden');
        }

        function goBack() {
            document.getElementById('next-section').classList.add('hidden');
            document.getElementById('home-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
