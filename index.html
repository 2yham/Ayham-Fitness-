<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A FITNESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات FontAwesome لإنستغرام وسناب شات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* توهج فسفوري */
        .neon-btn {
            background-color: #ccff00;
            color: #000000;
            box-shadow: 0 0 25px rgba(204, 255, 0, 0.45);
        }
        .neon-btn:hover {
            background-color: #d9ff33;
            box-shadow: 0 0 35px rgba(204, 255, 0, 0.75);
        }
        .neon-text {
            color: #ccff00;
            text-shadow: 0 0 15px rgba(204, 255, 0, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-black text-white selection:bg-[#ccff00] selection:text-black">

    <!-- القسم الأول: شاشة كاملة نظيفة باللون الفسفوري -->
    <main id="home-section" class="flex-grow flex flex-col items-center justify-center px-6 py-16 text-center min-h-[85vh]">
        
        <!-- الشعار الخاص بك مع معالجة تلقائية لصيغ الصور -->
        <div class="mb-8 flex items-center justify-center">
            <img id="brand-logo" 
                 src="./logo.png" 
                 alt="A FITNESS" 
                 onerror="handleImageError(this)"
                 class="w-44 h-44 mx-auto object-contain rounded-2xl">
            
            <!-- شعار بديل يظهر فقط إذا لم يتم العثور على ملف الصورة في المستودع -->
            <div id="fallback-logo" class="hidden w-36 h-36 rounded-3xl border-2 border-[#ccff00] bg-[#ccff00]/10 flex items-center justify-center shadow-[0_0_30px_rgba(204,255,0,0.2)]">
                <span class="text-7xl font-black neon-text">A</span>
            </div>
        </div>

        <!-- العنوان الرئيسي -->
        <h1 class="text-4xl md:text-5xl font-black tracking-wider mb-3 uppercase">
            A <span class="neon-text">FITNESS</span>
        </h1>
        
        <p class="text-zinc-400 text-base md:text-lg max-w-sm mb-10 font-semibold">
            ابـدأ الـتـغـيـيـر الـحـقـيـقـي الآن
        </p>

        <!-- زر ابدأ الآن باللون الفسفوري -->
        <button onclick="goToNextStep()" class="w-full max-w-xs neon-btn active:scale-95 font-black text-xl py-4 px-8 rounded-full transition-all duration-200 cursor-pointer">
            ابدأ الآن
        </button>

    </main>

    <!-- القسم الثاني: الخانة التالية (تظهر عند الضغط) -->
    <section id="next-section" class="hidden flex-grow flex flex-col items-center justify-center px-6 py-16 text-center min-h-[85vh] fade-in">
        <div class="w-full max-w-md">
            <h2 class="text-3xl font-black mb-4 text-white">الخطوة <span class="neon-text">الثانية</span></h2>
            <p class="text-zinc-400 text-base mb-8">
                أهلاً بك! إحكيلي شو بدك نحط جوا هاي الخانة هسا عشان أبرمجلك إياها فوراً.
            </p>
            <button onclick="goBack()" class="text-zinc-400 hover:text-[#ccff00] border border-zinc-800 hover:border-[#ccff00] px-6 py-2.5 rounded-full text-sm font-bold transition">
                → رجوع
            </button>
        </div>
    </section>

    <!-- التذييل السفلي: خانة التواصل الاجتماعي الفسفورية + خانة حقوق النشر البيضاء -->
    <footer class="w-full">
        <!-- قسم وسائل التواصل الاجتماعي باللون الفسفوري -->
        <div class="w-full bg-[#ccff00] py-10 px-4 text-center">
            <h3 class="text-[#141824] text-2xl md:text-3xl font-black mb-6">
                وسائل التواصل الاجتماعي
            </h3>
            
            <div class="flex items-center justify-center gap-4">
                <!-- أيقونة إنستغرام -->
                <a href="https://www.instagram.com/2yhamm/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"
                   class="w-12 h-12 bg-[#141824] text-[#ccff00] rounded-2xl flex items-center justify-center text-2xl hover:scale-110 active:scale-95 transition-transform duration-200 shadow-md">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <!-- أيقونة سناب شات -->
                <a href="https://www.snapchat.com/add/eldwaymeh" target="_blank" rel="noopener noreferrer" aria-label="Snapchat"
                   class="w-12 h-12 bg-[#141824] text-[#ccff00] rounded-2xl flex items-center justify-center text-2xl hover:scale-110 active:scale-95 transition-transform duration-200 shadow-md">
                    <i class="fa-brands fa-snapchat"></i>
                </a>
            </div>
        </div>

        <!-- خانة حقوق النشر البيضاء تحت التواصل الاجتماعي مباشرة -->
        <div class="w-full bg-white text-black py-4 px-4 text-center text-sm font-bold">
            جميع الحقوق محفوظة &copy; 2026 A FITNESS
        </div>
    </footer>

    <script>
        // محاولة تحميل الصورة بأكثر من صيغة تلقائياً إذا لم تعمل الأولى
        let attempt = 0;
        const possibleNames = ['./logo.jpg', './logo.jpeg', './LOGO.PNG', './LOGO.JPG'];
        
        function handleImageError(img) {
            if (attempt < possibleNames.length) {
                img.src = possibleNames[attempt];
                attempt++;
            } else {
                img.classList.add('hidden');
                document.getElementById('fallback-logo').classList.remove('hidden');
            }
        }

        function goToNextStep() {
            document.getElementById('home-section').classList.add('hidden');
            document.getElementById('next-section').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            document.getElementById('next-section').classList.add('hidden');
            document.getElementById('home-section').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
